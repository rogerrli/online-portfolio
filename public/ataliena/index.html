<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070B1A">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* A night sky, so this page stays dark in both colour schemes on purpose. */
:root{
  --sky:#070B1A; --sky2:#0E1430; --ink:#E4E8F5; --muted:#8E99BC;
  --star:#F2C14E; --dim:#48537D; --line:#F2C14E;
  --lit:0;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(130% 90% at 50% 8%,var(--sky2) 0%,var(--sky) 62%);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
  line-height:1.5;
  min-height:100svh;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- ambient starfield ----------
   Only for the screens that come before the sky is live. Once the canvas is up it
   has background stars of its own, and they move with the sky; these do not. */
#field{position:fixed;inset:0;pointer-events:none;z-index:0}
#field i{position:absolute;display:block;border-radius:50%;background:#fff;opacity:.5}
body.sky #field{display:none}
@media (prefers-reduced-motion:no-preference){
  #field i{animation:tw var(--d,4s) ease-in-out var(--delay,0s) infinite}
  @keyframes tw{0%,100%{opacity:var(--o,.5)}50%{opacity:calc(var(--o,.5) * .25)}}
}

/* ---------- the sky ---------- */
/* A canvas is a replaced element, so inset:0 alone leaves it at its intrinsic 300x150
   and the sky ends up drawn into a box in the corner. The sizes are explicit. */
#sky{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:0;pointer-events:none}
body.sky #sky{display:block}

/* ---------- the target frame ----------
   The only affordance on the page: it says "put something here" without saying what.
   Sized in JS to a fixed angular width, so it means the same thing on every screen. */
#frame{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:120px;height:120px;z-index:1;pointer-events:none;display:none;
  /* Fades up with the warmth rather than sitting there from the first frame. An empty
     frame in the middle of the screen announces that this is a game of aiming, which is
     the one thing she is supposed to work out for herself. */
  opacity:calc(var(--lit) * 1.9);
}
body.sky #frame{display:block}
body[data-state="done"] #frame,
body[data-state="lights"] #frame{display:none}
#frame i{
  position:absolute;width:17px;height:17px;
  border:1.5px solid color-mix(in srgb,var(--star) calc(var(--lit) * 100%),var(--dim));
}
#frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

/* ---------- layout ---------- */
.wrap{
  position:relative;z-index:2;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,5vh,38px);
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));
  text-align:center;
  pointer-events:none;
}
.wrap > * {pointer-events:auto}
/* With the sky live the middle of the screen belongs to the stars, so the words
   move out of its way rather than sitting on top of them. */
body.sky .wrap{justify-content:space-between}
h1{
  font-family:"Young Serif",Georgia,serif;font-weight:400;
  font-size:clamp(2.1rem,11vw,3rem);line-height:1;margin:0;letter-spacing:-.01em;
  transition:opacity 1.1s ease;
}
.sub{color:var(--muted);margin:0;max-width:30ch;font-size:clamp(.95rem,4vw,1.05rem)}
.sub b{color:var(--ink);font-weight:700}

/* ---------- daylight ----------
   With the lights on there is nothing to see, so the page says so and waits. Pure
   CSS, so flipping the system setting changes it instantly with no reload. Only an
   explicit light preference counts — "no preference" falls through to the sky. */
@media (prefers-color-scheme:light){
  :root{--sky:#E8ECF6;--sky2:#F7F9FD;--ink:#1C2647;--muted:#5B6688;--dim:#C6CDE0}
  #field{display:none}
  body:not([data-state="done"]) [data-step]{display:none!important}
  body:not([data-state="done"]) [data-step="lights"]{display:flex!important}
  body:not([data-state="done"]) h1{display:block!important}
  /* the stars are still up there, just washed out by the daylight */
  body:not([data-state="done"]) #sky{display:block;opacity:.4}
  body:not([data-state="done"]) #frame{display:none}
  body:not([data-state="done"]) .wrap{justify-content:space-between}
  /* She has already earned the night sky, so don't take it back at the last step. */
  body[data-state="done"]{--sky:#070B1A;--sky2:#0E1430;--ink:#E4E8F5;--muted:#8E99BC;--dim:#48537D}
}

/* ---------- the opening tap ---------- */
/* iOS will not release compass data without a gesture, so the first screen asks
   for one. "Log in" and the sky stay hidden until it comes. */
body[data-state="tap"]{cursor:pointer}
body[data-state="tap"] h1{display:none}
.tapline{
  font-family:"Young Serif",Georgia,serif;font-weight:400;
  font-size:clamp(1.45rem,7vw,2rem);color:var(--muted);margin:0;letter-spacing:.01em;
}
@media (prefers-reduced-motion:no-preference){
  .tapline{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
}

body[data-state="done"] h1{opacity:.3}

/* ---------- the seatbelt ----------
   One clue, once per visit: it names the belt without naming Orion and without pointing
   anywhere, so it stays a riddle rather than an instruction and the gate itself stays
   wordless. It holds a beat on its own and dissolves as the sky comes up. */
body[data-state="buckle"] h1{display:none}
.buckleline{
  font-family:"Young Serif",Georgia,serif;font-weight:400;
  font-size:clamp(1.45rem,7vw,2rem);color:var(--ink);margin:0;letter-spacing:.01em;
  animation:buckle 2.6s ease both;
}
@keyframes buckle{0%{opacity:0}18%{opacity:1}68%{opacity:1}100%{opacity:0}}
/* The sky fades up rather than cutting in, so it reads as the lights going down. */
body.sky #sky{animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0}to{opacity:1}}

/* ---------- controls ---------- */
button{
  font:inherit;font-weight:700;color:#070B1A;background:var(--star);
  border:0;border-radius:999px;padding:13px 38px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  #next{transition:opacity 1s ease .45s}
}

/* ---------- state machine ---------- */
[data-step]{display:none;flex-direction:column;align-items:center;gap:18px}
/* The Next button holds its space from the moment the sky appears, so arriving
   fades it in without nudging anything else on the page. */
body[data-state="seek"] [data-step="done"]{display:flex}
body[data-state="seek"] #next{opacity:0;pointer-events:none}
body[data-state="done"] #next{opacity:1}
body[data-state="tap"]     [data-step="tap"],
body[data-state="buckle"]  [data-step="buckle"],
body[data-state="desktop"] [data-step="desktop"],
body[data-state="blocked"] [data-step="blocked"],
body[data-state="lights"]  [data-step="lights"],
body[data-state="done"]    [data-step="done"]{display:flex}

.note{color:var(--muted);font-size:.82rem;max-width:34ch;margin:0}

#debug{
  position:fixed;left:8px;bottom:8px;z-index:9;display:none;
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:rgba(7,11,26,.92);border:1px solid #2A3357;border-radius:6px;
  padding:7px 9px;text-align:left;color:var(--muted);white-space:pre;
}
body.dbg #debug{display:block}
</style>
</head>
<body data-state="tap">

<div id="field" aria-hidden="true"></div>
<canvas id="sky" role="img" aria-label="The constellation Orion, rising"></canvas>
<div id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="wrap">

  <h1>Log in</h1>

  <div data-step="tap">
    <p class="tapline">Tap to start</p>
  </div>

  <div data-step="buckle">
    <p class="buckleline">Put on your seatbelt.</p>
  </div>

  <div data-step="lights">
    <p class="sub">It&rsquo;s a bit light out to see the stars.</p>
  </div>

  <!-- the only screens that say anything at all -->
  <div data-step="done">
    <button id="next" type="button">Next</button>
  </div>

  <div data-step="desktop">
    <p class="sub"><b>This one needs your phone.</b></p>
  </div>

  <div data-step="blocked">
    <p class="sub" id="blockedMsg"></p>
  </div>

</main>

<div id="debug" aria-hidden="true"></div>

<script>
/* ============================ settings ============================ */
/* Both webkitCompassHeading and Android's absolute orientation read from *magnetic*
   north, and Boerum Hill's declination is about 13 degrees west. The whole sky is shifted
   into the sensors' frame once, here, so there is only ever one set of angles in play. */
const DECLINATION = 13;
const LATITUDE    = 40.7;   // Boerum Hill, Brooklyn
/* Where the belt is caught: just clear of the horizon, so all three stars are up and only
   the hunter's trailing foot is still under the ground. */
const BELT_ALT    = 2;

/* Which way the phone is sighted along. 90 is straight out of the back of the phone,
   which puts the horizon on screen only when the phone is held bolt upright — and upright
   is exactly where the compass fails, because Core Location reads its heading off the
   device's top edge and that edge is then pointing at the zenith with no horizontal left
   to project onto. Tilting the sight toward the top edge brings the horizon on screen at
   a comfortable wrist angle instead, well clear of that dead zone. The puzzle is unchanged
   by this: she still faces where the belt rises, and the belt still lands in the sight.
   ?sight=N overrides it, so the sweet spot can be found on a real phone without a deploy. */
const SIGHT_DEG= (() => {
  const v = new URLSearchParams(location.search).get("sight");
  return v === null ? 45 : Math.max(0, Math.min(90, +v || 0));
})();

const AZ_TOL   = 10;    // degrees either side of the belt
const ALT_TOL  = 10;    // degrees above or below it
const HOLD_MS  = 5000;  // how long both must be held
const BUCKLE_MS= 2600;  // the clue holds this long before the sky comes up
const HOLD_POW = 2.5;   // the hold fills slowly at first, then rushes at the end
/* How close she has to be before the page starts helping at all: inside this the stars
   warm to gold, the halos bloom and the sight fades up. It used to be 70 degrees, which
   made the whole sky a hot-and-cold gradient you could follow without ever noticing you
   were looking at a constellation. At 30 the warmth stops being a search tool and becomes
   confirmation that she has found it. ?help=N dials it; 70 is roughly the old behaviour. */
const HELP_FROM= (() => {
  const v = new URLSearchParams(location.search).get("help");
  return v === null ? 30 : Math.max(AZ_TOL + 1, Math.min(180, +v || 0));
})();
const EASE_MS  = 70;    // how hard the sky is smoothed when the compass is trustworthy
const SHAKY_MS = 520;   // ...and when it is not, which is the pose this gate asks for
const UNWIND   = 2.5;   // the hold unwinds this much faster than it fills, so one twitchy
                        // frame costs a moment rather than the whole attempt
const FRAME_DEG= 7;     // width of the target frame, in degrees of sky: a little wider
                        // than the belt is long, so it reads as a sight to drop it into
const DIAG_FOV = 65;    // field of view across the screen diagonal — fixed, so rotating
                        // the phone changes what you see but never how big it is
/* Absolute, not relative. The QR points at /ataliena with no trailing slash, so a
   relative "puzzle.html" resolves against / and lands on /puzzle.html — nowhere. */
const PUZZLE   = "/ataliena/puzzle.html";
/* The login is not remembered — every visit earns its way in again. The crossword's
   own answers do persist; that is a separate key, written by the puzzle itself. */

const qs = new URLSearchParams(location.search);
if (qs.has("debug")) document.body.classList.add("dbg");

/* Only an explicit light preference holds her at the door; "no preference" goes
   straight through. Decorative motion is the only thing reduced-motion turns off —
   the sky tracking is the puzzle, so it always runs. */
const lightQ = matchMedia("(prefers-color-scheme: light)");
const calmQ  = matchMedia("(prefers-reduced-motion: reduce)");

const DEG = Math.PI / 180;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const norm  = a => ((a % 360) + 360) % 360;
// shortest signed turn from `a` to `b`, in (-180, 180]
const delta = (a, b) => ((b - a + 540) % 360) - 180;

/* ============================ Orion ============================
   The real catalogue — right ascension in hours, declination in degrees, visual
   magnitude — so the figure can be checked against a star chart instead of against a
   pile of screen coordinates. */
const CAT = {
  betelgeuse: [5.9200,  7.41, 0.45],
  bellatrix:  [5.4183,  6.35, 1.64],
  meissa:     [5.5850,  9.93, 3.39],
  mintaka:    [5.5333, -0.30, 2.25],
  alnilam:    [5.6033, -1.20, 1.69],
  alnitak:    [5.6800, -1.94, 1.74],
  rigel:      [5.2417, -8.20, 0.18],
  saiph:      [5.7967, -9.67, 2.07],
};

/* The hold draws the figure in, and it starts at the belt — which is the whole point of
   the puzzle — then knits outward through the shoulders and down to the feet. */
const FIGURE = [
  ["mintaka","alnilam"], ["alnilam","alnitak"],
  ["alnitak","betelgeuse"], ["betelgeuse","meissa"], ["meissa","bellatrix"],
  ["bellatrix","mintaka"],
  ["mintaka","rigel"], ["alnitak","saiph"],
];

// unit vector for a point in the sky. World axes: x east, y up, z south.
function dir(az, alt) {
  const ca = Math.cos(alt * DEG);
  return [ca * Math.sin(az * DEG), Math.sin(alt * DEG), -ca * Math.cos(az * DEG)];
}

const PHI = LATITUDE * DEG;
function altaz(c, lst) {
  const H = (lst - c[0]) * 15 * DEG, d = c[1] * DEG;
  const sh = Math.sin(PHI) * Math.sin(d) + Math.cos(PHI) * Math.cos(d) * Math.cos(H);
  const alt = Math.asin(clamp(sh, -1, 1));
  const az  = Math.atan2(-Math.cos(d) * Math.sin(H), Math.sin(d) - Math.sin(PHI) * sh);
  return [norm(az / DEG), alt / DEG];
}

/* Catch the sky at the instant the belt has just cleared the horizon in the east: solve
   for the sidereal time at which Alnilam sits BELT_ALT up while rising, then put every
   star where it really is at that moment. Doing it properly rather than by eye is what
   lays the hunter on his side with the belt standing upright, and it lands Alnilam on
   azimuth 92.5 — due east, which is the answer she is being asked for. */
/* The sidereal time the whole sky is frozen at: the instant Alnilam sits BELT_ALT above the
   horizon, rising. Everything on screen is placed through this one number, so Orion and the
   stars around it belong to the same moment rather than being a constellation pasted onto a
   backdrop. */
const LST = (() => {
  let lo = -3, hi = 0.3, lst = 0;
  for (let i = 0; i < 60; i++) {
    lst = (lo + hi) / 2;
    if (altaz(CAT.alnilam, lst)[1] < BELT_ALT) lo = lst; else hi = lst;
  }
  return lst;
})();

/* Twinkle from the star's own coordinates rather than a random seed: no shuffling between
   reloads, and nothing to carry. */
const phase = (ra, dec) => ({ ph: (ra * 7.13 + dec * 3.7) % 6.2832, sp: 0.7 + (ra * 1.7) % 1.4 });

const ORION = {};
let TARGET_AZ = 0, TARGET_ALT = 0, TARGET_V = null;
(function placeOrion() {
  for (const k in CAT) {
    const [az, alt] = altaz(CAT[k], LST);
    ORION[k] = { az: az + DECLINATION, alt, mag: CAT[k][2],
                 v: dir(az + DECLINATION, alt), ...phase(CAT[k][0], CAT[k][1]) };
  }
  TARGET_AZ = ORION.alnilam.az; TARGET_ALT = ORION.alnilam.alt; TARGET_V = ORION.alnilam.v;
})();

/* Placed through the same instant and the same magnetic shift as Orion, so what she sweeps
   past is the sky that was actually over Boerum Hill when the belt cleared the horizon:
   Taurus and the Pleiades up and north of the hunter, Auriga above them, Pegasus round to
   the west. Orion has to be picked out of its real neighbours. */
const BACKDROP = STARS.map(([ra, dec, mag]) => {
  const [az, alt] = altaz([ra, dec], LST);
  return { v: dir(az + DECLINATION, alt), mag, ...phase(ra, dec) };
});

// one list, so every star is drawn by the same code and none of them is special
const SKY = BACKDROP.concat(Object.values(ORION));

/* ============================ quaternions ============================

   alpha falls apart, so the view is carried as a quaternion from first to last and the
   angles are only ever read back out of it at the end. */
// turn the view to look along the sighting axis: 90 is out of the back, 0 is along the top edge
const Q_CAM = [-Math.sin(SIGHT_DEG * DEG / 2), 0, 0, Math.cos(SIGHT_DEG * DEG / 2)];

  const [ax,ay,az,aw] = a, [bx,by,bz,bw] = b;
  return [
    aw*bx + ax*bw + ay*bz - az*by,
    aw*by - ax*bz + ay*bw + az*bx,
    aw*bz + ax*by - ay*bx + az*bw,
    aw*bw - ax*bx - ay*by - az*bz,
  ];
}
function qRot(q, v) {
  const [x,y,z,w] = q, [vx,vy,vz] = v;
  const tx = 2*(y*vz - z*vy), ty = 2*(z*vx - x*vz), tz = 2*(x*vy - y*vx);
  return [vx + w*tx + y*tz - z*ty, vy + w*ty + z*tx - x*tz, vz + w*tz + x*ty - y*tx];
}
// YXZ, the order the orientation event's angles are applied in
function qFromEuler(x, y, z) {
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2);
  const s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  return [
    s1*c2*c3 + c1*s2*s3,
    c1*s2*c3 - s1*c2*s3,
    c1*c2*s3 - s1*s2*c3,
    c1*c2*c3 + s1*s2*s3,
  ];
}
/* Smoothing on the quaternion rather than on the angles. Raw compass output jitters by
   several degrees, and smoothing the angles instead is what sends the sky the long way
   round when the heading crosses north. */
function qSlerp(a, b, t) {
  let [bx,by,bz,bw] = b;
  let d = a[0]*bx + a[1]*by + a[2]*bz + a[3]*bw;
  if (d < 0) { bx=-bx; by=-by; bz=-bz; bw=-bw; d = -d; }
  let s0 = 1 - t, s1 = t;
  if (d < 0.9995) {
    const th = Math.acos(d), sn = Math.sin(th);
    s0 = Math.sin((1 - t) * th) / sn;
    s1 = Math.sin(t * th) / sn;
  }
  const o = [s0*a[0] + s1*bx, s0*a[1] + s1*by, s0*a[2] + s1*bz, s0*a[3] + s1*bw];
  const n = Math.hypot(o[0], o[1], o[2], o[3]) || 1;
  return [o[0]/n, o[1]/n, o[2]/n, o[3]/n];
}

/* The screen rotates inside the phone, so every reading has to be undone by however far
   the content has turned. Locking the orientation instead is not an option: it needs
   fullscreen on Android and does not exist on iOS. */
function screenAngle() {
  const a = (screen.orientation && screen.orientation.angle);
  return typeof a === "number" ? a : (window.orientation || 0);
}
/* The screen rotation has to swing the *lean*, so it is applied before the tilt and about
   the device's own z axis — which is y in the frame the Euler angles land in. While the
   sight pointed straight out of the back the two were the same rotation and the order
   didn't matter; with the sight leaning toward whichever edge is up, getting this wrong
   aims 50 degrees off and 30 below as soon as the phone is turned to landscape. At a
   90-degree sight this reduces to exactly the roll-about-the-view-axis it used to be. */
function viewQuat(alpha, beta, gamma) {
  const q = qFromEuler(beta * DEG, alpha * DEG, -gamma * DEG);
  const h = -screenAngle() * DEG / 2;
  return qMul(qMul(q, [0, Math.sin(h), 0, Math.cos(h)]), Q_CAM);
}
// looking due east at the belt, horizon level — the view the daylight screen shows
const Q_REST = (function () {
  const f = TARGET_V, up = [0,1,0];
  const r = [f[1]*up[2] - f[2]*up[1], f[2]*up[0] - f[0]*up[2], f[0]*up[1] - f[1]*up[0]];
  const rn = Math.hypot(...r); const R = r.map(v => v / rn);
  const U = [R[1]*f[2] - R[2]*f[1], R[2]*f[0] - R[0]*f[2], R[0]*f[1] - R[1]*f[0]];
  return { R, U, F: f };
})();

/* ============================ starfield (pre-sky screens) ============================ */
(function field() {
  const host = document.getElementById("field");
  const n = window.innerWidth < 500 ? 70 : 110;
  let html = "";
  for (let i = 0; i < n; i++) {
    const s = (Math.random() * 1.9 + 0.6).toFixed(2);
    const o = (Math.random() * 0.5 + 0.18).toFixed(2);
    html += `<i style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;`
          + `width:${s}px;height:${s}px;--o:${o};opacity:${o};`
          + `--d:${(Math.random()*4+2.5).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s"></i>`;
  }
  host.innerHTML = html;
})();

/* ============================ elements ============================ */
const body   = document.body;
const cv     = document.getElementById("sky");
const ctx    = cv.getContext("2d");
const frame  = document.getElementById("frame");
const dbg    = document.getElementById("debug");

function setState(s) {
  body.dataset.state = s;
  body.classList.toggle("sky", s === "seek" || s === "done" || s === "lights");
}

/* ============================ canvas ============================ */
let W = 0, H = 0, cx = 0, cy = 0, focal = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  focal = Math.hypot(W, H) / (2 * Math.tan(DIAG_FOV / 2 * DEG));
  const px = 2 * focal * Math.tan(FRAME_DEG / 2 * DEG);
  frame.style.width = frame.style.height = px.toFixed(1) + "px";
  if (!live()) paint(performance.now());
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ============================ the view ============================ */
let qRaw = null, qView = null, beta = null, gamma = null, evName = "-", absolute = false;
let gotReading = false, watching = false, lastAt = 0;
let R = Q_REST.R, U = Q_REST.U, F = Q_REST.F;

function basisFrom(q) {
  R = qRot(q, [1,0,0]); U = qRot(q, [0,1,0]); F = qRot(q, [0,0,-1]);
}
function project(v) {
  const z = v[0]*F[0] + v[1]*F[1] + v[2]*F[2];
  if (z <= 0.04) return null;                       // behind her, or grazing the edge
  const x = v[0]*R[0] + v[1]*R[1] + v[2]*R[2];
  const y = v[0]*U[0] + v[1]*U[1] + v[2]*U[2];
  return [cx + focal * x / z, cy - focal * y / z];
}

function onOrient(e) {
  let alpha = null;
  if (typeof e.webkitCompassHeading === "number" && !Number.isNaN(e.webkitCompassHeading)) {
    alpha = norm(360 - e.webkitCompassHeading);     // iOS: degrees clockwise from north
    absolute = true;
  } else if (e.absolute === true && typeof e.alpha === "number" && e.alpha !== null) {
    alpha = e.alpha;                                // Android absolute orientation
    absolute = true;
  }
  if (alpha === null || typeof e.beta !== "number" || typeof e.gamma !== "number") return;

  evName = e.type; beta = e.beta; gamma = e.gamma;
  qRaw = viewQuat(alpha, beta, gamma);
  if (!qView) qView = qRaw;
  gotReading = true;
  lastAt = performance.now();
}

/* ============================ drawing ============================ */
/* `cold` is what Orion looks like before the page is helping: plain starlight, the same
   white as the rest of the sky. Gold is a reward, not a label — marking the constellation
   from the first frame told her which stars mattered before she had worked out that stars
   were the point. */
const NIGHT = { star: [242,193,78], cold: [226,232,245], dim: [72,83,125], hz: "rgba(142,153,188,.30)", bg: "255,255,255" };
const DAY   = { star: [160,172,200], cold: [198,205,224], dim: [198,205,224], hz: "rgba(91,102,136,.18)", bg: "91,102,136" };
const mix = (a, b, t) => `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
// brighter stars are drawn bigger, the way a chart does it
/* One law of magnitude for every star on screen, Orion's included. A constellation quietly
   drawn a little larger or brighter than its neighbours is a constellation that has been
   pointed at, which is the one thing this page is trying not to do. */
const sizeOf  = m => clamp(3.3 - 0.52 * m, 0.5, 3.8);
const alphaOf = m => clamp(0.98 - 0.135 * m, 0.18, 1);

function horizon(p) {
  ctx.beginPath();
  let pen = false;
  for (let a = 0; a <= 360; a += 3) {
    const q = project(dir(a, 0));
    if (!q) { pen = false; continue; }
    if (pen) ctx.lineTo(q[0], q[1]); else { ctx.moveTo(q[0], q[1]); pen = true; }
  }
  ctx.strokeStyle = p.hz; ctx.lineWidth = 1; ctx.stroke();
}

function backdrop(p, t) {
  for (const s of SKY) {
    const q = project(s.v);
    if (!q || q[0] < -8 || q[0] > W + 8 || q[1] < -8 || q[1] > H + 8) continue;
    const a = alphaOf(s.mag);
    const o = calmQ.matches ? a : a * (0.78 + 0.22 * Math.sin(t / 1000 * s.sp + s.ph));
    ctx.beginPath(); ctx.arc(q[0], q[1], sizeOf(s.mag), 0, 6.2832);
    ctx.fillStyle = `rgba(${p.bg},${o.toFixed(3)})`; ctx.fill();
  }
}

/* The constellation lines are the hold indicator. They pay out along the figure as a
   single thread, belt first, so holding steady visibly knits the hunter together and
   letting go unpicks him. */
function figure(p, lit, prog) {
  if (prog <= 0.001) return;
  const seg = [];
  let total = 0;
  for (const [a, b] of FIGURE) {
    const pa = project(ORION[a].v), pb = project(ORION[b].v);
    if (!pa || !pb) { seg.push(null); continue; }
    const len = Math.hypot(pb[0]-pa[0], pb[1]-pa[1]);
    seg.push({ pa, pb, len }); total += len;
  }
  if (!total) return;
  let left = prog * total;
  ctx.strokeStyle = mix(p.dim, p.star, clamp(lit, 0, 1));
  ctx.lineWidth = 1.1; ctx.lineCap = "round"; ctx.globalAlpha = 0.85;
  for (const s of seg) {
    if (left <= 0) break;
    if (!s) continue;
    const f = Math.min(1, left / s.len); left -= s.len;
    ctx.beginPath();
    ctx.moveTo(s.pa[0], s.pa[1]);
    ctx.lineTo(s.pa[0] + (s.pb[0]-s.pa[0]) * f, s.pa[1] + (s.pb[1]-s.pa[1]) * f);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* Only the warmth. Orion's stars have already been drawn by the sky, in the same starlight
   and at the same magnitudes as everything around them — far from the target there is
   nothing here to add, and the hunter is just more sky. Coming close warms him out of it,
   and overdrawing the discs at a steady alpha is what stops him twinkling as she locks on. */
function orion(p, lit) {
  if (lit <= 0.01) return;
  const col = mix(p.cold, p.star, clamp(lit, 0, 1));
  for (const k in ORION) {
    const s = ORION[k], q = project(s.v);
    if (!q) continue;
    const r = sizeOf(s.mag);
    const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], r * 4.6);
    g.addColorStop(0,   `rgba(${p.star[0]},${p.star[1]},${p.star[2]},${(0.52*lit).toFixed(3)})`);
    g.addColorStop(0.45,`rgba(${p.star[0]},${p.star[1]},${p.star[2]},${(0.18*lit).toFixed(3)})`);
    g.addColorStop(1,   `rgba(${p.star[0]},${p.star[1]},${p.star[2]},0)`);
    ctx.beginPath(); ctx.arc(q[0], q[1], r * 4.6, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 6.2832);
    ctx.fillStyle = lit > 0.985 ? "#FFF3D2" : col; ctx.fill();
  }
}

function paint(t) {
  const day = lightQ.matches && body.dataset.state !== "done";
  const p = day ? DAY : NIGHT;
  ctx.clearRect(0, 0, W, H);
  if (day) { ({ R, U, F } = Q_REST); orion(p, 0.3); figure(p, 0.3, 1); return; }
  horizon(p); backdrop(p, t); figure(p, lit, drawn); orion(p, lit);
}

/* ============================ the hold ============================ */
let held = 0, lit = 0, drawn = 0, lastFrame = 0;
/* Rolling spread of the heading, so "it twitches" can be read as a number under ?debug=1. */
const shake = []; let spread = 0;
const live = () => body.dataset.state === "seek";

function loop(now) {
  if (body.dataset.state === "done") return;
  const dt = lastFrame ? Math.min(100, now - lastFrame) : 16;
  lastFrame = now;

  let off = 180, dAz = 0, dAlt = 0, trust = 1;
  if (qRaw) {
    /* How much the heading is worth believing: the compass is read off the device's top
       edge, so it is at its best with that edge horizontal and worthless with it vertical.
       Smooth hardest exactly where the reading is worst — lag is a far smaller annoyance
       than jitter when what she has been asked to do is hold still. */
    trust = beta === null ? 1 : Math.abs(Math.cos(beta * DEG));
    const ease = SHAKY_MS + (EASE_MS - SHAKY_MS) * trust;
    // frame-rate independent smoothing, so the sky glides the same on any phone
    qView = qSlerp(qView, qRaw, 1 - Math.exp(-dt / ease));
    basisFrom(qView);

    const heading = norm(Math.atan2(F[0], -F[2]) / DEG);
    const elev    = Math.asin(clamp(F[1], -1, 1)) / DEG;
    dAz  = delta(TARGET_AZ, heading);
    dAlt = elev - TARGET_ALT;
    off  = Math.acos(clamp(F[0]*TARGET_V[0] + F[1]*TARGET_V[1] + F[2]*TARGET_V[2], -1, 1)) / DEG;

    shake.push(heading);
    if (shake.length > 90) shake.shift();
    spread = shake.reduce((m, h) => Math.max(m, Math.abs(delta(heading, h))), 0);

    // A stalled sensor must not let a stale "facing east" quietly finish the hold.
    const fresh = (now - lastAt) < 900;
    const ok = Math.abs(dAz) <= AZ_TOL && Math.abs(dAlt) <= ALT_TOL && fresh;
    /* The hold accumulates rather than restarting. Zeroing it on a single frame outside
       the tolerance threw away four seconds of patience for one flick of a noisy compass;
       unwinding faster than it fills still loses it properly when she turns away. */
    held = ok ? Math.min(HOLD_MS, held + dt) : Math.max(0, held - dt * UNWIND);
  }

  const p = held / HOLD_MS;
  /* The stars are the only feedback there is. They answer to how close she is, all the
     way from most of a turn away, and fill the rest in over the hold. */
  const near   = clamp((HELP_FROM - off) / (HELP_FROM - AZ_TOL), 0, 1);
  const target = Math.max(near * 0.55, p > 0 ? 0.55 + p * 0.45 : 0);
  lit  += (target - lit) * (1 - Math.exp(-dt / 140));
  const want = Math.pow(p, HOLD_POW);
  drawn = want >= drawn ? want : drawn + (want - drawn) * (1 - Math.exp(-dt / 220));
  document.documentElement.style.setProperty("--lit", lit.toFixed(3));

  paint(now);
  if (p >= 1) return succeed();

  if (body.classList.contains("dbg")) {
    dbg.textContent =
      `event    ${evName}\nabsolute ${absolute}\nscreen   ${screenAngle()}`
      + `\nd-az     ${dAz.toFixed(1)}\nd-alt    ${dAlt.toFixed(1)}\noff      ${off.toFixed(1)}`
      + `\nbeta     ${beta === null ? "null" : beta.toFixed(1)}\ngamma    ${gamma === null ? "null" : gamma.toFixed(1)}`
      + `\nsight    ${SIGHT_DEG}\ntrust    ${trust.toFixed(2)}\nwobble   ${spread.toFixed(1)}`
      + `\nlit      ${lit.toFixed(2)}\nhold     ${(held/1000).toFixed(1)}s`;
  }
  requestAnimationFrame(loop);
}

function succeed() {
  setState("done");
  lit = 1; drawn = 1; held = HOLD_MS;
  document.documentElement.style.setProperty("--lit", "1");
  paint(performance.now());
  if (navigator.vibrate) { try { navigator.vibrate([18, 70, 18]); } catch (e) {} }
}

/* ============================ sensors ============================ */
function listen() {
  if (watching) return;
  watching = true;
  window.addEventListener("deviceorientationabsolute", onOrient, true);
  window.addEventListener("deviceorientation", onOrient, true);
  /* The sensors start during the beat, not after it, so the sky is already tracking by the
     time she sees it and never arrives frozen and then lurching. */
  setState("buckle");
  resize();
  requestAnimationFrame(loop);
  setTimeout(() => { if (body.dataset.state === "buckle") { setState("seek"); resize(); } }, BUCKLE_MS);
  // If nothing ever arrives, the hardware or the permission isn't there.
  setTimeout(() => { if (!gotReading) blocked("sensor"); }, 5000);
}

/* The opening tap is what lets iOS hand over the compass. Every platform gets the
   same screen so the experience doesn't fork; elsewhere the tap just starts it. */
function arm() {
  setState("tap");
  document.addEventListener("click", async () => {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      let res;
      try { res = await DOE.requestPermission(); }
      catch (err) { return blocked("permission"); }
      if (res !== "granted") return blocked("permission");
    }
    listen();
  }, { once: true });
}

function blocked(why) {
  if (body.dataset.state === "done") return;
  // There is no way past this screen. Facing the belt is the only way in.
  document.getElementById("blockedMsg").innerHTML = why === "permission"
    ? "<b>I need the compass.</b> Allow motion &amp; orientation access, then reload."
    : "<b>No compass reading.</b> This phone may not have one.";
  setState("blocked");
}

/* ============================ wiring ============================ */
document.getElementById("next").addEventListener("click", () => location.assign(PUZZLE));

/* Nothing is armed while the lights are on — no sensors, no permission prompt — and
   turning them off starts the gate without a reload. The canvas may never have been
   sized if the lights came on mid-screen, so go through resize rather than paint. */
lightQ.addEventListener("change", e => {
  if (!e.matches && body.dataset.state === "lights") arm();
  else if (!live()) resize();
});

const coarse   = matchMedia("(pointer: coarse)").matches;
const touch    = (navigator.maxTouchPoints || 0) > 0;
const uaMobile = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
// iPadOS reports a desktop UA, so the coarse-pointer + touch pair is what catches it.
const isMobile = (coarse && touch) || uaMobile;

if (qs.has("preview")) {                                   // check the payoff without a compass
  setState("seek"); resize();
  setTimeout(() => { lit = 1; drawn = 1; succeed(); }, 400);
} else if (!isMobile && !qs.has("force")) {
  setState("desktop");
} else if (lightQ.matches) {
  setState("lights"); resize();
} else {
  arm();
}
</script>
</body>
</html>
