<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070B1A">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* A night sky, so this page stays dark in both colour schemes on purpose. */
:root{
  --sky:#070B1A; --sky2:#0E1430; --ink:#E4E8F5; --muted:#8E99BC;
  --star:#F2C14E; --dim:#48537D; --line:#F2C14E;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(130% 90% at 50% 8%,var(--sky2) 0%,var(--sky) 62%);
  color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
  line-height:1.5;
  min-height:100svh;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- ambient starfield ---------- */
#field{position:fixed;inset:0;pointer-events:none;z-index:0}
#field i{position:absolute;display:block;border-radius:50%;background:#fff;opacity:.5}
@media (prefers-reduced-motion:no-preference){
  #field i{animation:tw var(--d,4s) ease-in-out var(--delay,0s) infinite}
  @keyframes tw{0%,100%{opacity:var(--o,.5)}50%{opacity:calc(var(--o,.5) * .25)}}
}

/* ---------- layout ---------- */
.wrap{
  position:relative;z-index:1;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,5vh,38px);
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));
  text-align:center;
}
h1{
  font-family:"Young Serif",Georgia,serif;font-weight:400;
  font-size:clamp(2.1rem,11vw,3rem);line-height:1;margin:0;letter-spacing:-.01em;
  transition:opacity 1.1s ease;
}
.sub{color:var(--muted);margin:0;max-width:30ch;font-size:clamp(.95rem,4vw,1.05rem)}
.sub b{color:var(--ink);font-weight:700}

/* ---------- constellation ---------- */
#cass{width:min(94vw,470px);height:auto;display:block;overflow:visible;--lit:0}
#cass .lk{
  fill:none;stroke:var(--line);stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;opacity:.9;
}
#cass .st{fill:color-mix(in srgb,var(--star) calc(var(--lit) * 100%),var(--dim))}
#cass .glow{fill:url(#halo);opacity:calc(var(--lit) * .62)}

/* ---------- the opening tap ---------- */
/* iOS will not release compass data without a gesture, so the first screen asks
   for one. "Log in" and the constellation stay hidden until it comes. */
body[data-state="tap"]{cursor:pointer}
body[data-state="tap"] h1,
body[data-state="tap"] #cass{display:none}
.tapline{
  font-family:"Young Serif",Georgia,serif;font-weight:400;
  font-size:clamp(1.45rem,7vw,2rem);color:var(--muted);margin:0;letter-spacing:.01em;
}
@media (prefers-reduced-motion:no-preference){
  .tapline{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
}

body.done #cass .st{fill:#FFF3D2}
body.done #cass .glow{opacity:.95}
body.done #cass .lk{
  stroke-dashoffset:0;
  transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1);
}
@media (prefers-reduced-motion:reduce){
  body.done #cass .lk{transition:none;stroke-dashoffset:0}
}
body[data-state="done"] h1{opacity:.3}

/* ---------- controls ---------- */
button{
  font:inherit;font-weight:700;color:var(--sky);background:var(--star);
  border:0;border-radius:999px;padding:13px 38px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  #next{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* ---------- state machine ---------- */
[data-step]{display:none;flex-direction:column;align-items:center;gap:18px}
body[data-state="tap"]     [data-step="tap"],
body[data-state="desktop"] [data-step="desktop"],
body[data-state="blocked"] [data-step="blocked"],
body[data-state="done"]    [data-step="done"]{display:flex}

.note{color:var(--muted);font-size:.82rem;max-width:34ch;margin:0}

#debug{
  position:fixed;left:8px;bottom:8px;z-index:9;display:none;
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:rgba(7,11,26,.92);border:1px solid #2A3357;border-radius:6px;
  padding:7px 9px;text-align:left;color:var(--muted);white-space:pre;
}
body.dbg #debug{display:block}
</style>
</head>
<body data-state="tap">

<div id="field" aria-hidden="true"></div>

<main class="wrap">

  <h1>Log in</h1>

  <svg id="cass" viewBox="0 0 104 64" role="img" aria-label="The constellation Cassiopeia">
    <defs>
      <radialGradient id="halo">
        <stop offset="0%" stop-color="#F2C14E" stop-opacity=".85"/>
        <stop offset="45%" stop-color="#F2C14E" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#F2C14E" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path class="lk" pathLength="1" d="M10 20 L30 46 L52 26 L74 48 L94 16"/>
    <g>
      <circle class="glow" cx="10" cy="20" r="9"/>  <circle class="st" cx="10" cy="20" r="2.6"/>
      <circle class="glow" cx="30" cy="46" r="9.5"/><circle class="st" cx="30" cy="46" r="2.8"/>
      <circle class="glow" cx="52" cy="26" r="10"/> <circle class="st" cx="52" cy="26" r="2.9"/>
      <circle class="glow" cx="74" cy="48" r="8"/>  <circle class="st" cx="74" cy="48" r="2.3"/>
      <circle class="glow" cx="94" cy="16" r="7.5"/><circle class="st" cx="94" cy="16" r="2"/>
    </g>
  </svg>

  <div data-step="tap">
    <p class="tapline">Tap to start</p>
  </div>

  <!-- the only screens that say anything at all -->
  <div data-step="done">
    <button id="next" type="button">Next</button>
  </div>

  <div data-step="desktop">
    <p class="sub"><b>This one needs your phone.</b></p>
  </div>

  <div data-step="blocked">
    <p class="sub" id="blockedMsg"></p>
  </div>

</main>

<div id="debug" aria-hidden="true"></div>

<script>
/* ============================ settings ============================ */
const NORTH_TOL = 10;    // degrees either side of north
const LEVEL_TOL = 25;    // degrees of tilt still counted as "flat"
const HOLD_MS   = 3000;  // how long both must be held
const GLOW_FROM = 70;    // stars begin to answer from this far off north
/* Absolute, not relative. The QR points at /ataliena with no trailing slash, so a
   relative "puzzle.html" resolves against / and lands on /puzzle.html — nowhere. */
const PUZZLE    = "/ataliena/puzzle.html";
const UNLOCK    = "gift-crossword-first-impressions-unlocked";

const qs = new URLSearchParams(location.search);
if (qs.has("reset")) { try { localStorage.removeItem(UNLOCK); } catch (e) {} }
if (qs.has("debug")) document.body.classList.add("dbg");

/* Already solved it once? Don't make her do it again mid-crossword. */
let unlocked = false;
try { unlocked = localStorage.getItem(UNLOCK) === "1"; } catch (e) {}
if (unlocked && !qs.has("replay")) location.replace(PUZZLE);

/* ============================ starfield ============================ */
(function field() {
  const host = document.getElementById("field");
  const n = window.innerWidth < 500 ? 70 : 110;
  let html = "";
  for (let i = 0; i < n; i++) {
    const s = (Math.random() * 1.9 + 0.6).toFixed(2);
    const o = (Math.random() * 0.5 + 0.18).toFixed(2);
    html += `<i style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;`
          + `width:${s}px;height:${s}px;--o:${o};opacity:${o};`
          + `--d:${(Math.random()*4+2.5).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s"></i>`;
  }
  host.innerHTML = html;
})();

/* ============================ elements ============================ */
const body     = document.body;
const cass     = document.getElementById("cass");
const dbg      = document.getElementById("debug");
const setState = s => body.dataset.state = s;

/* ============================ mobile gate ============================ */
const coarse   = matchMedia("(pointer: coarse)").matches;
const touch    = (navigator.maxTouchPoints || 0) > 0;
const uaMobile = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
// iPadOS reports a desktop UA, so the coarse-pointer + touch pair is what catches it.
const isMobile = (coarse && touch) || uaMobile;

/* ============================ sensors ============================ */
let heading = null, beta = null, gamma = null, absolute = false, evName = "-";
let gotReading = false, watching = false, lastAt = 0;

const norm = a => ((a % 360) + 360) % 360;
// shortest signed turn from `a` to `b`, in (-180, 180]
const delta = (a, b) => ((b - a + 540) % 360) - 180;
const lerpAngle = (a, b, t) => norm(a + delta(a, b) * t);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === "number" && !Number.isNaN(e.webkitCompassHeading)) {
    h = e.webkitCompassHeading;            // iOS: degrees clockwise from north
    absolute = true;
  } else if (e.absolute === true && typeof e.alpha === "number" && e.alpha !== null) {
    h = norm(360 - e.alpha);               // Android absolute orientation
    absolute = true;
  }
  if (h === null) return;

  evName = e.type;
  if (typeof e.beta  === "number") beta  = e.beta;
  if (typeof e.gamma === "number") gamma = e.gamma;

  // light smoothing — raw compass output jitters by several degrees
  heading = heading === null ? h : lerpAngle(heading, h, 0.25);
  gotReading = true;
  lastAt = performance.now();
}

function listen() {
  if (watching) return;
  watching = true;
  window.addEventListener("deviceorientationabsolute", onOrient, true);
  window.addEventListener("deviceorientation", onOrient, true);
  setState("seek");
  requestAnimationFrame(loop);
  // If nothing ever arrives, the hardware or the permission isn't there.
  setTimeout(() => { if (!gotReading) blocked("sensor"); }, 5000);
}

/* The opening tap is what lets iOS hand over the compass. Every platform gets the
   same screen so the experience doesn't fork; elsewhere the tap just starts it. */
function arm() {
  setState("tap");
  document.addEventListener("click", async () => {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      let res;
      try { res = await DOE.requestPermission(); }
      catch (err) { return blocked("permission"); }
      if (res !== "granted") return blocked("permission");
    }
    listen();
  }, { once: true });
}

function blocked(why) {
  if (body.dataset.state === "done") return;
  // There is no way past this screen. Pointing north is the only way in.
  document.getElementById("blockedMsg").innerHTML = why === "permission"
    ? "<b>I need the compass.</b> Allow motion &amp; orientation access, then reload."
    : "<b>No compass reading.</b> This phone may not have one.";
  setState("blocked");
}

/* ============================ the hold ============================ */
let holdStart = 0, lit = 0;

function loop(now) {
  if (body.dataset.state === "done") return;

  if (heading !== null) {
    const off     = Math.abs(delta(0, heading));            // distance from north
    const onNorth = off <= NORTH_TOL;
    const tilt    = Math.max(Math.abs(beta ?? 99), Math.abs(gamma ?? 99));
    const level   = tilt <= LEVEL_TOL;
    // A stalled sensor must not let a stale "pointing north" finish the hold.
    const fresh   = (now - lastAt) < 900;
    const ok      = onNorth && level && fresh;

    if (ok) { if (!holdStart) holdStart = now; }
    else holdStart = 0;

    const p = holdStart ? Math.min(1, (now - holdStart) / HOLD_MS) : 0;

    /* The stars are the only feedback there is. They answer to how close she is,
       dimmed while the phone is tilted, then fill the rest of the way on the hold. */
    const near   = clamp((GLOW_FROM - off) / (GLOW_FROM - NORTH_TOL), 0, 1);
    const target = holdStart ? 0.55 + p * 0.45 : near * (level ? 0.5 : 0.18);
    lit += (target - lit) * 0.12;
    cass.style.setProperty("--lit", lit.toFixed(3));

    if (p >= 1) return succeed();
  }

  if (body.classList.contains("dbg")) {
    dbg.textContent =
      `event    ${evName}\nabsolute ${absolute}\nheading  ${heading === null ? "null" : heading.toFixed(1)}`
      + `\nbeta     ${beta === null ? "null" : beta.toFixed(1)}\ngamma    ${gamma === null ? "null" : gamma.toFixed(1)}`
      + `\nlit      ${lit.toFixed(2)}\nhold     ${holdStart ? (((now - holdStart) / 1000).toFixed(1) + "s") : "-"}`;
  }
  requestAnimationFrame(loop);
}

function succeed() {
  setState("done");
  body.classList.add("done");
  cass.style.setProperty("--lit", "1");
  try { localStorage.setItem(UNLOCK, "1"); } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate([18, 70, 18]); } catch (e) {} }
}

/* ============================ wiring ============================ */
document.getElementById("next").addEventListener("click", () => location.assign(PUZZLE));

if (qs.has("preview")) { setTimeout(succeed, 400); }       // check the payoff without a compass
else if (!isMobile && !qs.has("force")) setState("desktop");
else arm();
</script>
</body>
</html>
