<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>First Impressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- EDIT ME: title, intro, clues live in the <script> below ---------- */
:root{
  --paper:#E8ECF6; --ink:#1C2647; --muted:#5B6688; --line:#1C2647;
  --cell:#FFFFFF; --word:#CBD5F0; --cur:#F2C14E; --wrong:#D2453C; --star:#C9971F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A31; --ink:#E4E8F5; --muted:#9AA4C4; --line:#060914;
    --cell:#232B4A; --word:#34416E; --cur:#B88A1C; --wrong:#FF7A70; --star:#F2C14E;
  }
}
:root[data-theme="dark"]{
  --paper:#141A31; --ink:#E4E8F5; --muted:#9AA4C4; --line:#060914;
  --cell:#232B4A; --word:#34416E; --cur:#B88A1C; --wrong:#FF7A70; --star:#F2C14E;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,5vw,3.1rem);line-height:1;margin:0;letter-spacing:-.01em}
.intro{color:var(--muted);margin:.4rem 0 0;max-width:60ch;white-space:pre-line}
.intro::first-line{color:var(--ink);font-weight:700}
.cass{width:92px;height:52px;flex:none;color:var(--star)}
.layout{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:32px;align-items:start}
.board{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.bar{display:flex;gap:10px;align-items:baseline;min-height:3.2em;padding:10px 14px;margin-bottom:10px;background:var(--word);border-radius:6px}
.bar b{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(15,1fr);border:2px solid var(--line);background:var(--line);gap:1px;width:100%;aspect-ratio:1;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{position:relative;background:var(--cell);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(.8rem,2.6vw,1.4rem);text-transform:uppercase;cursor:pointer}
.c.b{background:var(--line);cursor:default}
.c.w{background:var(--word)}
.c.cur{background:var(--cur);color:#1C2647}
.c.bad .l{color:var(--wrong);text-decoration:line-through;text-decoration-thickness:2px}
.c .n{position:absolute;top:1px;left:2px;font-size:clamp(.42rem,1.1vw,.62rem);font-weight:400;line-height:1}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
button:hover{background:var(--word)}
button:focus-visible,.cl li:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.status{color:var(--muted);margin-left:auto;align-self:center;font-size:.9rem}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cl h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.4rem;margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.cl ol{list-style:none;margin:0;padding:0}
.cl li{display:grid;grid-template-columns:2.4em 1fr;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.95rem}
.cl li .k{font-weight:700;display:flex;align-items:flex-start;gap:3px}
.cl li.on{background:var(--word)}
.cl li.done .t{opacity:.5}
.film{width:.95em;height:.95em;flex:none;margin-top:.22em;color:var(--star)}
.c.sp::after{content:"";position:absolute;inset:2px;border:2px solid var(--star);pointer-events:none}
.cl li.special{border:1.5px solid var(--star);margin:4px 0}
.cl li.special .t{font-weight:700}
.star{width:1em;height:1em;flex:none;margin-top:.18em;color:var(--star)}
.cl li.todo .t{font-style:italic;color:var(--muted)}
.win{display:none;margin-top:14px;padding:12px 14px;border:1.5px solid var(--star);border-radius:6px}
.win.show{display:block}
body.master .tools,body.master .win{display:none}
@media print{body.master .c .l{visibility:visible}}
#kb{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;font-size:16px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .board{position:static}
  .clues{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.c{transition:background .08s}}
@media print{
  :root{--paper:#fff;--ink:#000;--muted:#000;--line:#000;--cell:#fff;--word:#fff;--cur:#fff;--star:#000}
  @page{margin:.5in}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .bar,.tools,.win,#kb{display:none!important}
  .layout{grid-template-columns:4.6in 1fr;gap:.3in}
  .board{position:static}
  .grid{width:4.6in}
  .c .l{visibility:hidden}
  .clues{gap:.2in;font-size:9pt}
  .cl li{padding:1px 0;break-inside:avoid}
  header{margin-bottom:.2in}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="cass" viewBox="0 0 92 52" aria-hidden="true">
      <polyline points="6,14 26,40 46,22 66,44 86,10" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
      <g fill="currentColor"><circle cx="6" cy="14" r="3.2"/><circle cx="26" cy="40" r="2.6"/><circle cx="46" cy="22" r="3.6"/><circle cx="66" cy="44" r="2.8"/><circle cx="86" cy="10" r="3"/></g>
    </svg>
    <div>
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
    </div>
  </header>
  <div class="layout">
    <div class="board">
      <div class="bar" id="bar" aria-live="polite"></div>
      <div class="grid" id="grid" role="grid" aria-label="Crossword grid"></div>
      <div class="tools">
        <button id="clear">Clear puzzle</button>
        <span class="status" id="status"></span>
      </div>
      <div class="win" id="win"></div>
    </div>
    <div class="clues">
      <section class="cl"><h2>Across</h2><ol id="across"></ol></section>
      <section class="cl"><h2>Down</h2><ol id="down"></ol></section>
    </div>
  </div>
</div>
<input id="kb" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Type a letter">
<script>
/* =================== EDIT HERE =================== */
const TITLE = "First Impressions";
const INTRO = "Happy Birthday Natalie :)\nSome of these answers are worth a closer look so you can find the next step";
const WIN_MESSAGE = "Every square is right. First impressions matter, so grab your 20A and take a closer look";
// Answers marked with the film icon (the seven photos). VIEWFINDER (20A) is left unmarked on purpose.
const SPECIAL = "20A"; // the very special answer (VIEWFINDER)
const MARKED = ["16A", "37A", "67A", "46D", "48D", "52D", "56D"];
// Clues keyed by number + direction. Anything missing shows as "Clue to come".
const CLUES = {
  "1A": "Burn letters?",
  "4A": "Spate",
  "8A": "Fly without an engine",
  "13A": "The correct answer to quebecois maple pudding",
  "14A": "Longed (for)",
  "16A": "Who you need to get sticky",
  "17A": "Not a fling, in dating-app shorthand",
  "18A": "Renaissance ___",
  "19A": "Oscar-winning lizard of 2011",
  "20A": "In order to see the missing clue",
  "23A": "Harrison who flew the Millennium Falcon",
  "24A": "Clicks-not-bricks sector",
  "25A": "C-___",
  "27A": "Worker with a comb",
  "28A": "Positive or negative",
  "31A": "Like most comets",
  "33A": "Wile E. Coyote's preferred initials",
  "34A": "Two-word promise",
  "36A": "Four for forks",
  "37A": "Locale for a stroll that happened on some \"under\" land?",
  "40A": "Wash out",
  "42A": "Yellowfin tuna",
  "43A": "School booster grp.",
  "46A": "Reciprocal of cosine",
  "47A": "Kernel left in the popcorn bag",
  "50A": "Slayed, in internet slang",
  "51A": "Overflow (with)",
  "54A": "Ran without going anywhere",
  "55A": "Rocket's children",
  "57A": "Happy Birth___ <3",
  "58A": "Play ground?",
  "59A": "What Avengers do when assembled",
  "61A": "Like Q9-0 by Mando",
  "64A": "Smidge",
  "65A": "___ Holiday",
  "66A": "Couch",
  "67A": "You'll be saying 'ay, caramba' when you see this facing forward",
  "68A": "Life ___ (Help, I've fallen and I can't get up!)",
  "69A": "Count (on)",
  "70A": "Equinox mo.",
  "1D": "Water, for salt",
  "2D": "'___ my tab'",
  "3D": "Insect that forms living rafts",
  "4D": "Drawing",
  "5D": "Playa Bowl fruit",
  "6D": "___ji of Unit-01",
  "7D": "What multiple Poppys famously can't be, as a verb",
  "8D": "[Back off!]",
  "9D": "Popular Poppy pose",
  "10D": "Not knightly",
  "11D": "You have six with Kevin Bacon",
  "12D": "Weathered",
  "15D": "___ space",
  "21D": "Ace",
  "22D": "Mullet's cousin",
  "26D": "Ace",
  "29D": "Spellbound",
  "30D": "Lyric tribute",
  "32D": "Cuttlefish fluid",
  "35D": "Mouths, in Latin",
  "37D": "Ochoa's Nobel-worthy discovery",
  "38D": "'Say it ___ so'",
  "39D": "'New phone ___ dis?'",
  "40D": "Skincare TikTok darling",
  "41D": "What hockey players fight for",
  "43D": "Some roofs",
  "44D": "No-win situation?",
  "45D": "Get sigma'd",
  "46D": "______ season",
  "48D": "We saw a falcon in the rain here",
  "49D": "Wyo. is on it in the summer",
  "52D": "It doesn't run across the Brooklyn Bridge",
  "53D": "Space blanket material",
  "56D": "____ party",
  "60D": "I had to go to the second hospital for this person",
  "62D": "Only U.S. prez born in Kentucky",
  "63D": "Cool, in '90s slang",
};
/* ================================================= */

const N=15;
const LAYOUT="...#....##........#.....#........#.....#...............#.........##....#..........##.........##...#.....####.........####.....#...##.........##..........#....##.........#...##..........#.....#........#.....#........##....#...";
const SOL_ENC="RkNTRU5GVVRZVlFSQkhWTlBVUlFFQlRSRVlHRVNOVkVSRU5BVEJJVlJKU1ZBUVJFU0JFUVJHTlZZRkNOQU9SUkFCQU1SRUJHTlZZUlFHQUdWUUJHVkFSRkVWSVJFSk5ZWEVWQUZSTlVWQ0dORlJQTkFHQllRWk5WUU5HUkdSUlpWUVlSUVhWR0ZRTkxGR05UUkhBVkdSRllOVkFHTlFFQlpOQUdOT1lSUlpITllSRUdFUllMRlJD";
const KEY="gift-crossword-first-impressions-v2";
const MASTER=false; // true = answer key

const rot=s=>s.replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-52)%26+65));
const solLetters=rot(atob(SOL_ENC));
const sol=[];{let k=0;for(let i=0;i<N*N;i++)sol.push(LAYOUT[i]==="#"?null:solLetters[k++]);}
const isB=i=>LAYOUT[i]==="#";

// numbering and entries
const num=Array(N*N).fill(0), entries=[], cellEntry=Array.from({length:N*N},()=>({A:null,D:null}));
let n=0;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const i=r*N+c; if(isB(i))continue;
  const sa=(c===0||isB(i-1))&&c<N-1&&!isB(i+1);
  const sd=(r===0||isB(i-N))&&r<N-1&&!isB(i+N);
  if(sa||sd){n++;num[i]=n;
    if(sa){const cells=[];for(let x=c;x<N&&!isB(r*N+x);x++)cells.push(r*N+x);entries.push({key:n+"A",n,dir:"A",cells});}
    if(sd){const cells=[];for(let y=r;y<N&&!isB(y*N+c);y++)cells.push(y*N+c);entries.push({key:n+"D",n,dir:"D",cells});}
  }
}
entries.forEach((e,ei)=>e.cells.forEach(i=>cellEntry[i][e.dir]=ei));

const spEntry=entries.find(e=>e.key===SPECIAL);
// state
let fill=Array(N*N).fill(""), bad=new Set();
if(MASTER){fill=sol.map(s=>s||"");}
else try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.fill&&s.fill.length===N*N)fill=s.fill;}catch(e){}
const save=()=>{if(MASTER)return;try{localStorage.setItem(KEY,JSON.stringify({fill}));}catch(e){}};
let cur=entries[0].cells[0], dir="A";

// build
document.getElementById("title").textContent=TITLE;
document.getElementById("intro").textContent=INTRO;
document.title=MASTER?TITLE+" (answer key)":TITLE;
if(MASTER){document.body.classList.add("master");document.getElementById("intro").textContent="Answer key. Keep this one to yourself.";}
const gridEl=document.getElementById("grid"), cellsEl=[];
for(let i=0;i<N*N;i++){
  const d=document.createElement("div");d.className="c"+(isB(i)?" b":"");
  if(!isB(i)){d.setAttribute("role","gridcell");
    if(num[i]){const s=document.createElement("span");s.className="n";s.textContent=num[i];d.appendChild(s);}
    const l=document.createElement("span");l.className="l";d.appendChild(l);
    d.addEventListener("click",()=>{if(cur===i)toggle();else{cur=i;if(cellEntry[i][dir]===null)toggle();}render();focusKb();});
  }
  if(spEntry&&spEntry.cells.includes(i))d.classList.add("sp");
  gridEl.appendChild(d);cellsEl.push(d);
}
const starSVG='<svg class="star" viewBox="0 0 16 16" aria-label="special answer"><path fill="currentColor" d="M8 .8l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L8 11.7l-4.4 2.5 1.1-4.9L.9 5.9l5-.5z"/></svg>';
const filmSVG='<svg class="film" viewBox="0 0 16 16" aria-label="photo answer"><rect x="1" y="2" width="14" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor"><rect x="3" y="3.6" width="1.6" height="1.6"/><rect x="3" y="7.2" width="1.6" height="1.6"/><rect x="3" y="10.8" width="1.6" height="1.6"/><rect x="11.4" y="3.6" width="1.6" height="1.6"/><rect x="11.4" y="7.2" width="1.6" height="1.6"/><rect x="11.4" y="10.8" width="1.6" height="1.6"/></g></svg>';
const liEls=[];
entries.forEach((e,ei)=>{
  const li=document.createElement("li");li.tabIndex=0;
  const t=CLUES[e.key];if(!t)li.classList.add("todo");if(e.key===SPECIAL)li.classList.add("special");
  li.innerHTML=`<span class="k">${e.n}${MARKED.includes(e.key)?filmSVG:""}${e.key===SPECIAL?starSVG:""}</span><span class="t"></span>`;
  li.querySelector(".t").textContent=(t||"Clue to come")+(MASTER?"  "+e.cells.map(i=>sol[i]).join(""):"");
  const go=()=>{dir=e.dir;cur=e.cells.find(i=>!fill[i])??e.cells[0];render();focusKb();};
  li.addEventListener("click",go);li.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
  document.getElementById(e.dir==="A"?"across":"down").appendChild(li);liEls.push(li);
});

function toggle(){const o=dir==="A"?"D":"A";if(cellEntry[cur][o]!==null)dir=o;}
function curEntry(){let ei=cellEntry[cur][dir];if(ei===null){toggle();ei=cellEntry[cur][dir];}return ei;}
function render(){
  const ei=curEntry(),e=entries[ei];
  cellsEl.forEach((d,i)=>{if(isB(i))return;
    d.querySelector(".l").textContent=fill[i];
    d.classList.toggle("w",e.cells.includes(i));d.classList.toggle("cur",i===cur);d.classList.toggle("bad",bad.has(i));});
  liEls.forEach((li,j)=>{li.classList.toggle("on",j===ei);li.classList.toggle("done",entries[j].cells.every(i=>fill[i]));});
  const bar=document.getElementById("bar");
  bar.innerHTML=`<b>${e.n} ${e.dir==="A"?"Across":"Down"}</b><span></span>`;
  bar.querySelector("span").textContent=CLUES[e.key]||"Clue to come";
  const filled=sol.filter((s,i)=>s&&fill[i]).length,total=sol.filter(Boolean).length;
  document.getElementById("status").textContent=filled===total?"All squares filled":`${filled} of ${total} squares filled`;
  const won=sol.every((s,i)=>!s||fill[i]===s);
  const w=document.getElementById("win");w.textContent=WIN_MESSAGE;w.classList.toggle("show",won);
}
function move(dr,dc){let r=Math.floor(cur/N),c=cur%N;do{r+=dr;c+=dc;}while(r>=0&&r<N&&c>=0&&c<N&&isB(r*N+c));if(r>=0&&r<N&&c>=0&&c<N)cur=r*N+c;}
function nextEntry(step){let ei=curEntry()+step;ei=(ei+entries.length)%entries.length;const e=entries[ei];dir=e.dir;cur=e.cells.find(i=>!fill[i])??e.cells[0];}
function type(ch){if(MASTER)return;
  fill[cur]=ch;bad.delete(cur);
  const e=entries[curEntry()],p=e.cells.indexOf(cur);
  const nxt=e.cells.slice(p+1).find(i=>!fill[i]);
  if(nxt!==undefined)cur=nxt;else if(p<e.cells.length-1)cur=e.cells[p+1];
  save();render();
}
function back(){if(MASTER)return;
  if(fill[cur]){fill[cur]="";}else{const e=entries[curEntry()],p=e.cells.indexOf(cur);if(p>0){cur=e.cells[p-1];fill[cur]="";}}
  bad.delete(cur);save();render();
}
const kb=document.getElementById("kb");
function focusKb(){kb.focus({preventScroll:true});}
kb.addEventListener("input",()=>{const v=(kb.value||"").toUpperCase().replace(/[^A-Z]/g,"");kb.value="";if(v)type(v[v.length-1]);});
kb.addEventListener("keydown",ev=>{
  const k=ev.key;
  if(k==="Backspace"||k==="Delete"){ev.preventDefault();back();}
  else if(k==="ArrowLeft"){ev.preventDefault();if(dir!=="A"){dir="A";if(cellEntry[cur].A===null)dir="D";}else move(0,-1);render();}
  else if(k==="ArrowRight"){ev.preventDefault();if(dir!=="A"){dir="A";if(cellEntry[cur].A===null)dir="D";}else move(0,1);render();}
  else if(k==="ArrowUp"){ev.preventDefault();if(dir!=="D"){dir="D";if(cellEntry[cur].D===null)dir="A";}else move(-1,0);render();}
  else if(k==="ArrowDown"){ev.preventDefault();if(dir!=="D"){dir="D";if(cellEntry[cur].D===null)dir="A";}else move(1,0);render();}
  else if(k==="Tab"||k==="Enter"){ev.preventDefault();nextEntry(ev.shiftKey?-1:1);render();}
  else if(k===" "){ev.preventDefault();toggle();render();}
});
document.getElementById("clear").addEventListener("click",()=>{
  if(!confirm("Clear every square? This can't be undone."))return;
  fill=Array(N*N).fill("");bad=new Set();save();render();
});
render();
</script>
</body>
</html>
